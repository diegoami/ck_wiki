name: Wiki

# Builds the CK3 chronicles and publishes them to GitHub Pages.
#
# Nothing here is generated by hand and nothing generated is committed. The
# pages are built in this job from two inputs that live elsewhere:
#
#   * the code, cloned from diegoami/Ck-parser;
#   * the saves, fetched from that repository's Releases.
#
# The third input is this repository's own `images/` directory, where
# diegoami/ck_portrait_generator commits the portraits and coats of arms it has
# harvested. Pushing an image here is all it takes to publish it: the pages
# already link every image by a name both projects derive, so the build only
# has to find the file.
#
# The manifests are committed back, because they are the companion's work
# queue: `portraits.json` at the root and one per chronicle, listing every
# image the wiki wants and which are still missing. That write touches no path
# this workflow triggers on, so it cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Monday morning: picks up saves attached to Releases during the week
    # without anyone having to remember to press the button.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ck-parser ref to build with (default: main)"
        required: false
      title:
        description: "Force every chronicle onto one title (default: each run's own)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository, for the images and the manifests
        uses: actions/checkout@v4
      - name: Check out the parser
        uses: actions/checkout@v4
        with:
          repository: diegoami/Ck-parser
          ref: ${{ inputs.ref || 'main' }}
          path: .parser
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: .parser
        run: uv sync --group dev
      - name: Fetch the saves from Ck-parser's Releases
        working-directory: .parser
        # The saves are on Ck-parser's Releases, not this repository's, and the
        # runner sets GITHUB_REPOSITORY to ck_wiki. A step-level `env:` cannot
        # fix that -- GitHub's own variables are re-injected and a declaration
        # there is ignored -- so the value is set on the command itself, where
        # it reaches the process. Both names are given because which one the
        # script reads depends on the Ck-parser ref being built.
        run: >-
          env GITHUB_REPOSITORY=diegoami/Ck-parser SAVES_REPO=diegoami/Ck-parser
          scripts/fetch_saves.sh saves
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the wikis
        # No --title: each run's chronicle is about its own played character's
        # primary title. Saves are grouped into runs automatically, so a save
        # from a new playthrough becomes a new chronicle with no config change.
        working-directory: .parser
        run: |
          uv run python -m ck3wiki.build saves --out ../site \
            --portraits ../images \
            ${{ inputs.title && format('--title {0}', inputs.title) || '' }}
      - name: Commit the manifests, so the companion can read its queue from git
        run: |
          rm -rf .parser
          # the manifests only; the pages themselves are never committed
          find site -name portraits.json -printf '%P\n' | while read -r rel; do
            mkdir -p "$(dirname "$rel")"
            cp "site/$rel" "$rel"
            git add "$rel"
          done
          if git diff --cached --quiet; then
            echo "nothing wanted has changed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update what the wiki is waiting for"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
