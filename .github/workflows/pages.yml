name: Wiki

# Builds the CK3 chronicles and publishes them to GitHub Pages.
#
# Nothing here is generated by hand and nothing generated is committed. The
# pages are built in this job from one input that lives elsewhere -- the code,
# cloned from diegoami/Ck-parser -- and two that live here:
#
#   * the saves, fetched from THIS repository's Releases, tagged by run seed;
#   * the images, in `images/`.
#
# The saves used to be on Ck-parser's Releases and moved here, so this
# repository now holds every input and every output of a run: saves, images,
# manifests and published pages. Ck-parser is code.
#
# That `images/` directory is where
# diegoami/ck_portrait_generator commits the portraits and coats of arms it has
# harvested. Pushing an image here is all it takes to publish it: the pages
# already link every image by a name both projects derive, so the build only
# has to find the file.
#
# The manifests are committed back, because they are the companion's work
# queue: `portraits.json` at the root and one per chronicle, listing every
# image the wiki wants and which are still missing. That write touches no path
# this workflow triggers on, so it cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/pages.yml"

  # A save arriving should rebuild the wiki. There are two triggers for that
  # because the obvious one is not dependable.
  release:
    # Fires when a release is created, published or edited. It does NOT
    # dependably fire when an asset is uploaded into a release that already
    # exists -- which is precisely how a save is normally added, into the
    # release for the run it belongs to. So this catches the case where a new
    # run gets a new release, and is a convenience rather than the contract.
    types: [created, published, released, prereleased, edited]

  repository_dispatch:
    # This is the one that always works, and the one to use. After uploading a
    # save, whoever uploaded it sends:
    #
    #   gh api repos/diegoami/ck_wiki/dispatches -f event_type=saves-updated
    #
    # one API call, no waiting for a webhook that may not come. It is also what
    # an agent should send when it has finished step 1 of the loop in
    # Ck-parser's docs/COMPANION_PROPOSAL.md.
    types: [saves-updated]

  schedule:
    # Backstop: picks up anything the triggers above missed, so a save can
    # never sit unbuilt for more than a week even if nobody sends a dispatch.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ck-parser ref to build with (default: main)"
        required: false
      title:
        description: "Force every chronicle onto one title (default: each run's own)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository, for the images and the manifests
        uses: actions/checkout@v4
      - name: Check out the parser
        uses: actions/checkout@v4
        with:
          repository: diegoami/Ck-parser
          ref: ${{ inputs.ref || 'main' }}
          path: .parser
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: .parser
        run: uv sync --group dev
      - name: Fetch the saves from this repository's Releases
        working-directory: .parser
        # SAVES_REPO names where the saves are, which is now this repository.
        # Every ref of the script reads it, so a build pinned to an older
        # Ck-parser ref by workflow_dispatch fetches from here too rather than
        # from wherever that ref happened to default to.
        #
        # It can live in a step-level `env:` precisely because it is not a
        # GITHUB_* name. The override this replaces could not: the runner
        # re-injects its own GITHUB_REPOSITORY over anything declared there, so
        # that one had to be set on the command itself to reach the process.
        # Nothing needs to override it any more -- the runner's own value names
        # this repository, which is now the right answer.
        run: scripts/fetch_saves.sh saves
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAVES_REPO: diegoami/ck_wiki
      - name: Build the wikis
        # No --title: each run's chronicle is about its own played character's
        # primary title. Saves are grouped into runs automatically, so a save
        # from a new playthrough becomes a new chronicle with no config change.
        working-directory: .parser
        run: |
          uv run python -m ck3wiki.build saves --out ../site \
            --portraits ../images \
            ${{ inputs.title && format('--title {0}', inputs.title) || '' }}
      - name: Commit the manifests, so the companion can read its queue from git
        run: |
          rm -rf .parser
          # the manifests only; the pages themselves are never committed
          find site -name portraits.json -printf '%P\n' | while read -r rel; do
            mkdir -p "$(dirname "$rel")"
            cp "site/$rel" "$rel"
            git add "$rel"
          done
          if git diff --cached --quiet; then
            echo "nothing wanted has changed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update what the wiki is waiting for"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
